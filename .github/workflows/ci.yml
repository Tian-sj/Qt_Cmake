name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Pure C++ (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux
          - os: macos-14
            platform: macOS
          - os: windows-2022
            platform: Windows

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Detect Ninja and compiler
        run: cmake -DFORCE=ON -P scripts/setup-toolchain.cmake
      - name: Configure
        run: cmake --preset local-core-only
      - name: Build
        run: cmake --build --preset local-core-only
      - name: Test
        run: ctest --preset local-core-only
      - name: Install libraries and CMake package
        run: cmake --install build/local-core-only --prefix build/install-test
      - name: Configure external consumer
        run: cmake -S tests/consumer -B build/consumer-test -G Ninja -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install-test
      - name: Build external consumer
        run: cmake --build build/consumer-test
      - name: Test external consumer
        run: ctest --test-dir build/consumer-test --output-on-failure

  gui:
    name: Qt GUI (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux
          - os: macos-14
            platform: macOS
          - os: windows-2022
            platform: Windows

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt 6.8 LTS
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true
      - name: Detect Ninja, Qt, and compiler
        run: cmake -DFORCE=ON -P scripts/setup-toolchain.cmake
      - name: Configure
        run: cmake --preset local-dev
      - name: Build
        run: cmake --build --preset local-dev
      - name: Test
        run: ctest --preset local-dev
      - name: Configure QML application
        run: cmake --preset local-qml-dev
      - name: Build QML application
        run: cmake --build --preset local-qml-dev
      - name: Lint QML
        run: cmake --build build/local-qml-dev --target cppproject_desktop_qml_qmllint
      - name: Test QML application
        run: ctest --preset local-qml-dev
      - name: Reconfigure QML from platform ABI cache
        run: cmake --preset local-qml-dev -DCPPPROJECT_QT_THIRD_PARTY_MODE=PREBUILT
      - name: Build QML from platform ABI cache
        run: cmake --build --preset local-qml-dev
      - name: Test QML from platform ABI cache
        run: ctest --preset local-qml-dev
      - name: Configure reusable Qt libraries
        run: cmake --preset local-qt-libraries
      - name: Build reusable Qt libraries
        run: cmake --build --preset local-qt-libraries
      - name: Test reusable Qt libraries
        run: ctest --preset local-qt-libraries
      - name: Install reusable Qt libraries
        run: cmake --install build/local-qt-libraries --prefix build/qt-install-test
      - name: Configure external Qt consumer
        run: cmake -S tests/qt_consumer -B build/qt-consumer-test -G Ninja -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/qt-install-test"
      - name: Build external Qt consumer
        run: cmake --build build/qt-consumer-test
      - name: Test external Qt consumer
        run: ctest --test-dir build/qt-consumer-test --output-on-failure
